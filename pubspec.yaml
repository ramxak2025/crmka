name: noor_muslim
description: >
  Исламское приложение для мусульман: время намаза, направление Киблы,
  достоверные Хадисы и Коран с тафсирами на русском языке.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Управление состоянием (современный подход)
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Навигация
  go_router: ^13.0.0

  # Сетевые запросы
  dio: ^5.4.0

  # Локальное хранилище
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Геолокация и компас
  geolocator: ^10.1.0
  flutter_compass: ^0.8.0
  permission_handler: ^11.1.0

  # UI компоненты
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  lottie: ^3.0.0

  # Уведомления
  flutter_local_notifications: ^17.0.0

  # Утилиты
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Математика для расчёта времени намаза
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  mockito: ^5.4.4
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
